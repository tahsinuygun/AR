<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>AR Sanal Lab</title>
  <style>
    :root{ color-scheme: dark; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:#EAF1FF;
      background:
        radial-gradient(900px 500px at 15% -10%, rgba(109,91,255,.45), transparent 55%),
        radial-gradient(900px 500px at 100% 10%, rgba(38,208,255,.25), transparent 60%),
        linear-gradient(180deg, #070A12, #0B1020);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
      box-sizing:border-box;
    }
    .card{
      width:min(920px, 100%);
      border-radius:22px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      box-shadow: 0 18px 40px rgba(0,0,0,.45);
      overflow:hidden;
    }
    header{
      padding:14px 16px;
      display:flex; gap:12px; align-items:center; flex-wrap:wrap;
      border-bottom:1px solid rgba(255,255,255,.08);
      background: rgba(6,10,18,.55);
      backdrop-filter: blur(10px);
    }
    header img{ height:40px; width:auto; display:block; filter: drop-shadow(0 6px 18px rgba(0,0,0,.35)); }
    header .t{ display:flex; flex-direction:column; line-height:1.05; }
    header .t b{ font-size:15px; letter-spacing:.2px; }
    header .t span{ font-size:12px; opacity:.75; }

    .grid{
      display:grid;
      gap:12px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      padding:16px;
    }
    a.btn{
      text-decoration:none;
      display:flex; align-items:center; justify-content:center; gap:10px;
      padding:14px 14px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color:#EAF1FF;
      font-weight:800;
      transition: transform .12s ease, border-color .12s ease;
    }
    a.btn:hover{ transform: translateY(-1px); border-color: rgba(255,255,255,.18); }
    a.primary{
      border:0;
      background: linear-gradient(135deg, rgba(109,91,255,.95), rgba(38,208,255,.80));
      color:#081018;
      box-shadow: 0 14px 30px rgba(109,91,255,.18), 0 10px 24px rgba(38,208,255,.12);
    }
    .small{
      padding: 0 16px 14px;
      font-size:12px;
      opacity:.70;
    }
    .footer-credit{
      text-align:center;
      padding: 10px 12px 16px;
      font-size: 11px;
      opacity: .65;
      letter-spacing: .2px;
    }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <img src="assets/maku_logo_420.png" alt="MAKÜ Logo">
      <div class="t">
        <b>AR Sanal Lab</b>
        <span>Platform seçiniz</span>
      </div>
    </header>

    <div class="grid">
      <a class="btn primary" href="android.html">Android</a>
      <a class="btn primary" href="ios.html">iOS</a>
      <a class="btn" href="qr.html">QR Üret (Android + iOS)</a>
    </div>

    <div class="small">
      Not: Tek bir parçayı direkt açmak için link sonuna <b>?m=model3</b> gibi ekleyebilirsiniz.
    </div>

    <div class="footer-credit">Bu uygulama Dr. Tahsin UYGUN tarafından hazırlanmıştır.</div>
  </div>

  <script>
    // opsiyonel: otomatik yönlendirme (istersen kaldırabilirsin)
    const ua = navigator.userAgent || "";
    const isIOS = /iPad|iPhone|iPod/.test(ua);
    if (new URL(location.href).searchParams.get("noauto") !== "1") {
      // İlk açılışta, kullanıcıya 350ms görünür kalsın
      setTimeout(()=>{ location.href = isIOS ? "ios.html" : "android.html"; }, 350);
    }
  </script>
</body>
</html>
